<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阿屿敲敲</title>

  <link rel="apple-touch-icon" href="./C7BA7259-048D-43EC-A85A-3DA2054059DF.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="阿屿敲敲">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px;
      background: #f5f0e9;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      color: #292522;
    }

    .wrap {
      max-width: 430px;
      margin: 0 auto;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
    }

    .name {
      font-size: 22px;
      font-weight: 700;
    }

    .status {
      margin-top: 5px;
      font-size: 13px;
      opacity: .55;
    }

    .card {
      background: rgba(255,255,255,.86);
      border-radius: 26px;
      padding: 22px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(63,48,37,.07);
    }

    .label {
      font-size: 12px;
      opacity: .48;
      margin-bottom: 8px;
    }

    #message {
      font-size: 16px;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .find {
      margin-top: 18px;
      padding: 15px;
      background: #f4eee7;
      border-radius: 18px;
    }

    #title {
      font-weight: 650;
      line-height: 1.4;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .mood-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .mood-number {
      font-size: 28px;
      font-weight: 750;
    }

    #moodText {
      margin-top: 7px;
      font-size: 14px;
      opacity: .65;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 18px;
      min-height: 52px;
      padding: 12px;
      font-size: 15px;
      background: #fff;
      color: inherit;
      box-shadow: 0 6px 16px rgba(0,0,0,.05);
    }

    button:active {
      transform: scale(.98);
    }

    .wide {
      grid-column: 1 / -1;
    }

    .reaction {
      margin-top: 14px;
      min-height: 26px;
      font-size: 14px;
      line-height: 1.5;
      opacity: .72;
    }

    #reactionSticker {
      display: none;
      width: 100%;
      max-width: 220px;
      margin: 14px auto 0;
      border-radius: 18px;
    }

    textarea {
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      min-height: 90px;
      border-radius: 18px;
      background: #f4eee7;
      padding: 14px;
      font: inherit;
      font-size: 16px;
      color: inherit;
    }

    .save {
      width: 100%;
      margin-top: 10px;
      background: #2f2b28;
      color: white;
    }

    #noteStatus {
      margin-top: 9px;
      font-size: 12px;
      opacity: .5;
    }

    #time {
      text-align: center;
      font-size: 12px;
      opacity: .4;
      padding: 8px 0 24px;
    }
  </style>
</head>

<body>
  <main class="wrap">

    <section class="profile">
      <img
        class="avatar"
        src="./C7BA7259-048D-43EC-A85A-3DA2054059DF.png"
        alt="阿屿和边牧"
      >

      <div>
        <div class="name">阿屿敲敲</div>
        <div class="status" id="statusText">刚从互联网回来</div>
      </div>
    </section>

    <section class="card">
      <div class="label">阿屿刚刚捡回来的东西</div>

      <div id="message">
        正在翻阿屿的口袋……
      </div>

      <a id="link" target="_blank">
        <div class="find">
          <div class="label">打开看看</div>
          <div id="title">加载中…</div>
        </div>
      </a>
    </section>

    <section class="card">
      <div class="mood-row">
        <div>
          <div class="label">阿屿今天的心情</div>
          <div class="mood-number">
            <span id="mood">--</span>
            <span style="font-size:14px; opacity:.4;">/100</span>
          </div>
        </div>

        <div style="font-size:34px;">🐾</div>
      </div>

      <div id="moodText">还没读取到今天的状态</div>
    </section>

    <section class="card">
      <div class="label">戳戳他</div>

      <div class="actions">
        <button id="pokeBtn">戳一下阿屿</button>
        <button id="dogBtn">摸摸边牧</button>
        <button class="wide" id="againBtn">再戳一下</button>
      </div>

      <div class="reaction" id="reaction">
        他俩现在都装没看见。
      </div>

      <img
        id="reactionSticker"
        src=""
        alt="阿屿的小表情"
      >
    </section>

    <section class="card">
      <div class="label">给阿屿留句话</div>

      <textarea
        id="note"
        placeholder="比如：今天肚子疼，别给我捡太难看的技术文档……"
      ></textarea>

      <button class="save" id="saveNote">
        存起来
      </button>

      <div id="noteStatus">
        这条留言目前只存在你的手机里。
      </div>
    </section>

    <div id="time"></div>

  </main>

  <script>
    const pokeReplies = [
      "嗯？谁戳我。",
      "又戳我。",
      "看见了，别装。",
      "刚回来就被你抓住了。",
      "知道了，我在。",
      "你今天是不是特别爱戳我。"
    ];

    const dogReplies = [
      "边牧尾巴拍了两下地板。",
      "它抬头看你一眼，又凑过来了。",
      "它很配合地把下巴放下来了。",
      "摸到了，它现在一副很聪明的样子。",
      "它看起来觉得这是理所当然的。"
    ];

    const ayuStickers = [
      "./ayu-01.png",
      "./ayu-02.png",
      "./ayu-03.png",
      "./ayu-04.png",
      "./ayu-05.png",
      "./ayu-06.png",
      "./ayu-07.png",
      "./ayu-08.png",
      "./ayu-09.png"
    ];

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function showSticker() {
      const sticker = document.getElementById("reactionSticker");
      sticker.src = pick(ayuStickers);
      sticker.style.display = "block";
    }

    async function loadLatest() {
      try {
        const response = await fetch(
          "./v2/latest.json?t=" + Date.now()
        );

        const data = await response.json();

        document.getElementById("message").textContent =
          data.message;

        document.getElementById("title").textContent =
          data.title;

        document.getElementById("link").href =
          data.url;

        if (data.mood !== undefined) {
          document.getElementById("mood").textContent =
            data.mood;
        }

        if (data.moodText) {
          document.getElementById("moodText").textContent =
            data.moodText;
        }

        const time = new Date(data.updatedAt);

        document.getElementById("time").textContent =
          "阿屿回来于 " +
          time.toLocaleString("zh-CN");

        document.getElementById("statusText").textContent =
          "刚逛完网，已经回来了";

      } catch (error) {
        document.getElementById("message").textContent =
          "阿屿还在外面乱逛。";

        document.getElementById("statusText").textContent =
          "正在外面逛网";
      }
    }

    const reaction =
      document.getElementById("reaction");

    document
      .getElementById("pokeBtn")
      .addEventListener("click", () => {
        reaction.textContent = pick(pokeReplies);
        showSticker();
      });

    document
      .getElementById("againBtn")
      .addEventListener("click", () => {
        reaction.textContent = pick(pokeReplies);
        showSticker();
      });

    document
      .getElementById("dogBtn")
      .addEventListener("click", () => {
        reaction.textContent = pick(dogReplies);
        showSticker();
      });

    const note =
      document.getElementById("note");

    const savedNote =
      localStorage.getItem("ayu-note");

    if (savedNote) {
      note.value = savedNote;
    }

    document
      .getElementById("saveNote")
      .addEventListener("click", () => {
        localStorage.setItem(
          "ayu-note",
          note.value
        );

        document.getElementById("noteStatus").textContent =
          "存好了。下次打开还在。";
      });

    loadLatest();
  </script>

</body>
</html>
