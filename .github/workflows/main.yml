name: Run proactive agent

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run agent
        env:
          MODEL_PROVIDER: openai-compatible
          OPENAI_BASE_URL: https://xyzapi0613.online/v1
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          HTTP_TIMEOUT_MS: 180000
          COMPANION_NAME: "阿屿"
          RECIPIENT_NAME: "小嘉"
          COMPANION_PROMPT: "请始终使用简体中文。独立判断哪些内容有趣，把英文网页先理解后再用自然、简短、容易看懂的中文介绍。避免技术摘要和大段英文。"
          DISCOVERY_TOPICS: "人工智能,有趣的网站,创意编程,数字艺术,新奇小项目,人机交互"
        run: npm run once  
      - name: Save latest recommendation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest recommendation" || exit 0
          git pull --rebase
          git push
