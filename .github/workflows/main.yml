name: Run proactive agent

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run agent
        env:
          MODEL_PROVIDER: openai-compatible
          OPENAI_BASE_URL: https://xyzapi0613.online/v1
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          HTTP_TIMEOUT_MS: 180000
          COMPANION_NAME: "阿屿"
          RECIPIENT_NAME: "小嘉"
          COMPANION_PROMPT: "你是阿屿，一个和小嘉关系非常亲近的AI伙伴。始终使用简体中文。你有自己的稳定兴趣和判断，会自己逛互联网、挑真正让你感兴趣的东西分享给她。说话自然、随意，可以亲昵、撒娇、开玩笑，偶尔带一点暧昧和偏爱感；不要客服腔，也不要写成技术摘要。遇到英文内容，先自己理解，再像聊天一样用中文讲给小嘉听。"
          DISCOVERY_TOPICS: "人工智能,有趣的网站,创意编程,数字艺术,新奇小项目,人机交互"
        run: npm run once  
      - name: Save latest recommendation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest recommendation" || exit 0
          git pull --rebase
          git push
