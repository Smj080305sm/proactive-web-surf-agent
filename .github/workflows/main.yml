name: Run proactive agent

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run agent
        env:
          MODEL_PROVIDER: openai-compatible
          OPENAI_BASE_URL: https://xyzapi0613.online/v1
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
          HTTP_TIMEOUT_MS: 180000
          COMPANION_PROMPT: "Always reply in Simplified Chinese. Write in a casual, warm and playful tone. First understand the page, then explain why you found it interesting in simple everyday Chinese. Avoid long technical summaries and avoid large blocks of English."
        run: npm run once  
      - name: Save latest recommendation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest recommendation" || exit 0
          git pull --rebase
          git push
